[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cvsf-ner"
version = "0.1.0"
description = "Candidate verification and score fusion for low-resource named entity recognition"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
authors = [{name = "CVSF-NER contributors"}]
dependencies = [
  "numpy>=2.0,<3", "scipy>=1.13,<2", "pandas>=2.2,<3",
  "scikit-learn>=1.5,<1.8", "joblib>=1.3,<2"
]

[project.optional-dependencies]
train = ["torch>=2.6", "transformers>=5.9,<5.10", "accelerate>=1.13,<2", "safetensors>=0.7,<1", "sentencepiece>=0.2,<1"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
cvsf = "cvsf.cli:main"

[project.urls]
Repository = "https://github.com/oljas123/CVSF-NER"
Issues = "https://github.com/oljas123/CVSF-NER/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["neural: requires PyTorch and Transformers", "integration: complete CPU training pipeline", "external: requires the separate external-model environment"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
